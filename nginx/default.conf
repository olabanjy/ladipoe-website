# Host Nginx template for the production server.
# Certbot can add the HTTPS server block automatically after the first run.

server {
    listen 80;
    server_name ladipoe.live www.ladipoe.live;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 20m;
    server_tokens off;

    location /static/ {
        alias /home/devops/poe/vol/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /home/devops/poe/vol/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
