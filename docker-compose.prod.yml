version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poe}
      POSTGRES_USER: ${POSTGRES_USER:-poe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poe} -d ${POSTGRES_DB:-poe}"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  web:
    build: .
    entrypoint: ["/app/scripts/entrypoint.prod.sh"]
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --max-requests 1000 --max-requests-jitter 100
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-poe}
      DB_USER: ${POSTGRES_USER:-poe}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-poe}
    env_file:
      - .env.prod
    volumes:
      - static_volume:/vol/static
      - media_volume:/vol/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


volumes:
  static_volume:
  media_volume:
  postgres_data:
