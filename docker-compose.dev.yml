services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poe}
      POSTGRES_USER: ${POSTGRES_USER:-poe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poe} -d ${POSTGRES_DB:-poe}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    entrypoint: ["/app/scripts/entrypoint.dev.sh"]
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-poe}
      DB_USER: ${POSTGRES_USER:-poe}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-poe}
      WATCHFILES_FORCE_POLLING: "true"
    env_file:
      - .env.dev
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
